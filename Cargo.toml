[package]
name = "rahsia"
version = "0.1.0"
edition = "2024"
description = "Runtime secret management"

[dependencies]
camino = "1.2.2"
clap = { version = "4", features = ["derive", "color"] }
color-eyre = "0.6.5"
dialoguer = { version = "0.12", features = ["password"] }
dirs = "6"
dotenvy = "0.15.7"
jiff = "0.2.20"
regex = "1"
secrecy = "0.10.3"
serde = "1"
serde_json = "1"
thiserror = "2"
rustyline = { version = "15", features = ["derive"] }
shell-words = "1"
zeroize = "1"
rusqlite = { version = "0.40.1", features = [
  "bundled-sqlcipher-vendored-openssl",
] }

[dev-dependencies]
tempfile = "3"
