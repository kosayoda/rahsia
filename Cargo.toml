[package]
name = "rahsia"
version = "0.1.0"
edition = "2024"
description = "Runtime secret management"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
camino = "1.2.2"
clap = { version = "4", features = ["derive"] }
color-eyre = "0.6.5"
dialoguer = { version = "0.12", features = ["password"] }
dirs = "6"
dotenvy = "0.15.7"
jiff = { version = "0.2.20", features = ["serde"] }
rand = "0.9"

secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
